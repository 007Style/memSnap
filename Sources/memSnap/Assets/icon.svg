<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#0d0d1a"/>
    </radialGradient>
    <radialGradient id="glowGreen" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#44D97A" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#44D97A" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="18" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softglow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="brainGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5BB8FF"/>
      <stop offset="50%" stop-color="#9D6BF5"/>
      <stop offset="100%" stop-color="#44D97A"/>
    </linearGradient>
    <linearGradient id="chipGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2a2a4a"/>
      <stop offset="100%" stop-color="#1a1a30"/>
    </linearGradient>
  </defs>

  <!-- Background circle -->
  <circle cx="512" cy="512" r="480" fill="url(#bgGrad)"/>
  <circle cx="512" cy="512" r="480" fill="none" stroke="#9D6BF5" stroke-width="6" opacity="0.4"/>

  <!-- Outer glow halo -->
  <circle cx="512" cy="512" r="440" fill="url(#glowGreen)" opacity="0.6"/>

  <!-- ── Circuit board trace lines ─────────────────────────────────────── -->
  <!-- Horizontal traces -->
  <line x1="160" y1="340" x2="340" y2="340" stroke="#5BB8FF" stroke-width="3" opacity="0.35"/>
  <line x1="684" y1="340" x2="864" y2="340" stroke="#5BB8FF" stroke-width="3" opacity="0.35"/>
  <line x1="160" y1="684" x2="340" y2="684" stroke="#44D97A" stroke-width="3" opacity="0.35"/>
  <line x1="684" y1="684" x2="864" y2="684" stroke="#44D97A" stroke-width="3" opacity="0.35"/>
  <!-- Vertical traces -->
  <line x1="340" y1="160" x2="340" y2="340" stroke="#9D6BF5" stroke-width="3" opacity="0.35"/>
  <line x1="684" y1="160" x2="684" y2="340" stroke="#9D6BF5" stroke-width="3" opacity="0.35"/>
  <line x1="340" y1="684" x2="340" y2="864" stroke="#F5C842" stroke-width="3" opacity="0.35"/>
  <line x1="684" y1="684" x2="684" y2="864" stroke="#F5C842" stroke-width="3" opacity="0.35"/>
  <!-- Corner circuit nodes -->
  <circle cx="340" cy="340" r="7" fill="#5BB8FF" opacity="0.6"/>
  <circle cx="684" cy="340" r="7" fill="#9D6BF5" opacity="0.6"/>
  <circle cx="340" cy="684" r="7" fill="#44D97A" opacity="0.6"/>
  <circle cx="684" cy="684" r="7" fill="#F5C842" opacity="0.6"/>
  <!-- Extra mid traces -->
  <line x1="200" y1="512" x2="300" y2="512" stroke="#F5C842" stroke-width="2.5" opacity="0.25"/>
  <line x1="724" y1="512" x2="824" y2="512" stroke="#F5C842" stroke-width="2.5" opacity="0.25"/>
  <line x1="512" y1="200" x2="512" y2="290" stroke="#F58A1F" stroke-width="2.5" opacity="0.25"/>
  <line x1="512" y1="734" x2="512" y2="824" stroke="#F58A1F" stroke-width="2.5" opacity="0.25"/>

  <!-- ── RAM chip slots (left side) ─────────────────────────────────────── -->
  <g opacity="0.85">
    <!-- Chip 1 -->
    <rect x="148" y="390" width="88" height="34" rx="5" fill="url(#chipGrad)" stroke="#5BB8FF" stroke-width="2"/>
    <rect x="156" y="397" width="72" height="20" rx="3" fill="#5BB8FF" opacity="0.12"/>
    <line x1="165" y1="390" x2="165" y2="381" stroke="#5BB8FF" stroke-width="2.5" opacity="0.7"/>
    <line x1="180" y1="390" x2="180" y2="381" stroke="#5BB8FF" stroke-width="2.5" opacity="0.7"/>
    <line x1="195" y1="390" x2="195" y2="381" stroke="#5BB8FF" stroke-width="2.5" opacity="0.7"/>
    <line x1="210" y1="390" x2="210" y2="381" stroke="#5BB8FF" stroke-width="2.5" opacity="0.7"/>
    <line x1="165" y1="424" x2="165" y2="433" stroke="#5BB8FF" stroke-width="2.5" opacity="0.7"/>
    <line x1="180" y1="424" x2="180" y2="433" stroke="#5BB8FF" stroke-width="2.5" opacity="0.7"/>
    <line x1="195" y1="424" x2="195" y2="433" stroke="#5BB8FF" stroke-width="2.5" opacity="0.7"/>
    <line x1="210" y1="424" x2="210" y2="433" stroke="#5BB8FF" stroke-width="2.5" opacity="0.7"/>
    <!-- Chip 2 -->
    <rect x="148" y="600" width="88" height="34" rx="5" fill="url(#chipGrad)" stroke="#44D97A" stroke-width="2"/>
    <rect x="156" y="607" width="72" height="20" rx="3" fill="#44D97A" opacity="0.12"/>
    <line x1="165" y1="600" x2="165" y2="591" stroke="#44D97A" stroke-width="2.5" opacity="0.7"/>
    <line x1="180" y1="600" x2="180" y2="591" stroke="#44D97A" stroke-width="2.5" opacity="0.7"/>
    <line x1="195" y1="600" x2="195" y2="591" stroke="#44D97A" stroke-width="2.5" opacity="0.7"/>
    <line x1="210" y1="600" x2="210" y2="591" stroke="#44D97A" stroke-width="2.5" opacity="0.7"/>
    <line x1="165" y1="634" x2="165" y2="643" stroke="#44D97A" stroke-width="2.5" opacity="0.7"/>
    <line x1="180" y1="634" x2="180" y2="643" stroke="#44D97A" stroke-width="2.5" opacity="0.7"/>
    <line x1="195" y1="634" x2="195" y2="643" stroke="#44D97A" stroke-width="2.5" opacity="0.7"/>
    <line x1="210" y1="634" x2="210" y2="643" stroke="#44D97A" stroke-width="2.5" opacity="0.7"/>
  </g>

  <!-- ── RAM chip slots (right side) ────────────────────────────────────── -->
  <g opacity="0.85">
    <rect x="788" y="390" width="88" height="34" rx="5" fill="url(#chipGrad)" stroke="#9D6BF5" stroke-width="2"/>
    <rect x="796" y="397" width="72" height="20" rx="3" fill="#9D6BF5" opacity="0.12"/>
    <line x1="805" y1="390" x2="805" y2="381" stroke="#9D6BF5" stroke-width="2.5" opacity="0.7"/>
    <line x1="820" y1="390" x2="820" y2="381" stroke="#9D6BF5" stroke-width="2.5" opacity="0.7"/>
    <line x1="835" y1="390" x2="835" y2="381" stroke="#9D6BF5" stroke-width="2.5" opacity="0.7"/>
    <line x1="850" y1="390" x2="850" y2="381" stroke="#9D6BF5" stroke-width="2.5" opacity="0.7"/>
    <line x1="805" y1="424" x2="805" y2="433" stroke="#9D6BF5" stroke-width="2.5" opacity="0.7"/>
    <line x1="820" y1="424" x2="820" y2="433" stroke="#9D6BF5" stroke-width="2.5" opacity="0.7"/>
    <line x1="835" y1="424" x2="835" y2="433" stroke="#9D6BF5" stroke-width="2.5" opacity="0.7"/>
    <line x1="850" y1="424" x2="850" y2="433" stroke="#9D6BF5" stroke-width="2.5" opacity="0.7"/>
    <rect x="788" y="600" width="88" height="34" rx="5" fill="url(#chipGrad)" stroke="#F5C842" stroke-width="2"/>
    <rect x="796" y="607" width="72" height="20" rx="3" fill="#F5C842" opacity="0.12"/>
    <line x1="805" y1="600" x2="805" y2="591" stroke="#F5C842" stroke-width="2.5" opacity="0.7"/>
    <line x1="820" y1="600" x2="820" y2="591" stroke="#F5C842" stroke-width="2.5" opacity="0.7"/>
    <line x1="835" y1="600" x2="835" y2="591" stroke="#F5C842" stroke-width="2.5" opacity="0.7"/>
    <line x1="850" y1="600" x2="850" y2="591" stroke="#F5C842" stroke-width="2.5" opacity="0.7"/>
    <line x1="805" y1="634" x2="805" y2="643" stroke="#F5C842" stroke-width="2.5" opacity="0.7"/>
    <line x1="820" y1="634" x2="820" y2="643" stroke="#F5C842" stroke-width="2.5" opacity="0.7"/>
    <line x1="835" y1="634" x2="835" y2="643" stroke="#F5C842" stroke-width="2.5" opacity="0.7"/>
    <line x1="850" y1="634" x2="850" y2="643" stroke="#F5C842" stroke-width="2.5" opacity="0.7"/>
  </g>

  <!-- ── Central brain shape ────────────────────────────────────────────── -->
  <g filter="url(#glow)">
    <!-- Left hemisphere -->
    <path d="
      M 512 310
      C 455 310, 395 340, 368 390
      C 342 438, 342 468, 348 498
      C 354 528, 348 558, 358 585
      C 370 615, 395 635, 422 645
      C 448 655, 470 650, 490 640
      C 505 632, 512 620, 512 610
      Z
    " fill="url(#brainGrad)" opacity="0.92" filter="url(#softglow)"/>

    <!-- Right hemisphere -->
    <path d="
      M 512 310
      C 569 310, 629 340, 656 390
      C 682 438, 682 468, 676 498
      C 670 528, 676 558, 666 585
      C 654 615, 629 635, 602 645
      C 576 655, 554 650, 534 640
      C 519 632, 512 620, 512 610
      Z
    " fill="url(#brainGrad)" opacity="0.92" filter="url(#softglow)"/>

    <!-- Center stem -->
    <rect x="505" y="610" width="14" height="55" rx="7" fill="#9D6BF5" opacity="0.7"/>

    <!-- Brain fold lines — left hemisphere -->
    <path d="M 400 420 C 415 405, 440 410, 450 430" fill="none" stroke="#0d0d1a" stroke-width="5" stroke-linecap="round" opacity="0.55"/>
    <path d="M 390 480 C 405 465, 435 472, 448 490" fill="none" stroke="#0d0d1a" stroke-width="5" stroke-linecap="round" opacity="0.55"/>
    <path d="M 395 535 C 412 520, 440 528, 452 548" fill="none" stroke="#0d0d1a" stroke-width="5" stroke-linecap="round" opacity="0.55"/>
    <path d="M 415 585 C 430 572, 455 576, 462 592" fill="none" stroke="#0d0d1a" stroke-width="5" stroke-linecap="round" opacity="0.45"/>

    <!-- Brain fold lines — right hemisphere -->
    <path d="M 624 420 C 609 405, 584 410, 574 430" fill="none" stroke="#0d0d1a" stroke-width="5" stroke-linecap="round" opacity="0.55"/>
    <path d="M 634 480 C 619 465, 589 472, 576 490" fill="none" stroke="#0d0d1a" stroke-width="5" stroke-linecap="round" opacity="0.55"/>
    <path d="M 629 535 C 612 520, 584 528, 572 548" fill="none" stroke="#0d0d1a" stroke-width="5" stroke-linecap="round" opacity="0.55"/>
    <path d="M 609 585 C 594 572, 569 576, 562 592" fill="none" stroke="#0d0d1a" stroke-width="5" stroke-linecap="round" opacity="0.45"/>
  </g>

  <!-- ── Pressure-level colored circuit dots on brain surface ───────────── -->
  <circle cx="430" cy="440" r="9" fill="#44D97A" opacity="0.85" filter="url(#softglow)"/>
  <circle cx="415" cy="505" r="9" fill="#F5C842" opacity="0.85" filter="url(#softglow)"/>
  <circle cx="428" cy="565" r="9" fill="#F58A1F" opacity="0.85" filter="url(#softglow)"/>
  <circle cx="594" cy="440" r="9" fill="#F04E4E" opacity="0.85" filter="url(#softglow)"/>
  <circle cx="609" cy="505" r="9" fill="#9D6BF5" opacity="0.85" filter="url(#softglow)"/>
  <circle cx="596" cy="565" r="9" fill="#5BB8FF" opacity="0.85" filter="url(#softglow)"/>

  <!-- ── Pressure meter arc at bottom ──────────────────────────────────── -->
  <g transform="translate(512, 760)">
    <!-- Track -->
    <path d="M -110 0 A 110 110 0 0 1 110 0" fill="none" stroke="#222240" stroke-width="14" stroke-linecap="round"/>
    <!-- Green zone -->
    <path d="M -110 0 A 110 110 0 0 1 -38 -104" fill="none" stroke="#44D97A" stroke-width="10" stroke-linecap="round" opacity="0.9"/>
    <!-- Amber zone -->
    <path d="M -38 -104 A 110 110 0 0 1 38 -104" fill="none" stroke="#F5C842" stroke-width="10" stroke-linecap="round" opacity="0.9"/>
    <!-- Orange zone -->
    <path d="M 38 -104 A 110 110 0 0 1 85 -68" fill="none" stroke="#F58A1F" stroke-width="10" stroke-linecap="round" opacity="0.9"/>
    <!-- Red zone -->
    <path d="M 85 -68 A 110 110 0 0 1 110 0" fill="none" stroke="#F04E4E" stroke-width="10" stroke-linecap="round" opacity="0.9"/>
    <!-- Needle at ~35% (normal zone) -->
    <line x1="0" y1="0" x2="-72" y2="-84" stroke="#ffffff" stroke-width="5" stroke-linecap="round" opacity="0.9"/>
    <circle cx="0" cy="0" r="10" fill="#ffffff" opacity="0.9"/>
    <circle cx="0" cy="0" r="5" fill="#0d0d1a"/>
  </g>

  <!-- ── Outer ring tick marks ─────────────────────────────────────────── -->
  <g opacity="0.2" stroke="#ffffff" stroke-width="2">
    <line x1="512" y1="52" x2="512" y2="82"/>
    <line x1="512" y1="942" x2="512" y2="972"/>
    <line x1="52" y1="512" x2="82" y2="512"/>
    <line x1="942" y1="512" x2="972" y2="512"/>
    <line x1="193" y1="152" x2="214" y2="173"/>
    <line x1="810" y1="152" x2="831" y2="173"/>
    <line x1="152" y1="810" x2="173" y2="831"/>
    <line x1="852" y1="810" x2="831" y2="831"/>
  </g>

  <!-- ── "M" monogram subtle watermark ─────────────────────────────────── -->
  <text x="512" y="295" text-anchor="middle" font-family="'SF Pro Display', 'Helvetica Neue', sans-serif"
    font-size="68" font-weight="700" fill="#9D6BF5" opacity="0.22" letter-spacing="6">memSnap</text>
</svg>
